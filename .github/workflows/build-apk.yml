name: Build MoodlePulse Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK licenses
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          if [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest --console=plain --no-daemon 2>&1 | tee test.log

      - name: Report test/compile failure summary
        if: failure()
        run: |
          echo "### Gradle Failure Tail" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 80 test.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(e: |FAILURE:|> Task .* FAILED|.*Exception|.*Error)" test.log | head -n 15 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true

      - name: Build Debug APK
        run: gradle assembleDebug --console=plain --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MoodlePulse-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
